     <style>
         * { scroll-behavior: smooth; }

         .glass {

         }

         .glass-hover:hover {
             background: rgba(255, 255, 255, 0.06);
             border-color: rgba(255, 255, 255, 0.15);
         }

         .glow-line {
             height: 2px;
             background: linear-gradient(90deg, transparent, #22d3ee, #3b82f6, #8b5cf6, transparent);

         .glow-line-vertical {
             width: 2px;

         }

         .pulse-ring {
             animation: pulseRing 2s ease-out infinite;
         }

         @keyframes pulseRing {
             0% { transform: scale(1); opacity: 0.6; }
             100% { transform: scale(1.8); opacity: 0; }
         }

         .float {
             animation: float 6s ease-in-out infinite;
         }

         @keyframes float {
             0%, 100% { transform: translateY(0); }
             50% { transform: translateY(-12px); }
         }

         .float-delayed {
             animation: float 6s ease-in-out infinite;
             animation-delay: -3s;
         }

         .wave-bar {
             animation: waveBar 1.2s ease-in-out infinite;
         }

         @keyframes waveBar {
             0%, 100% { transform: scaleY(0.3); }
             50% { transform: scaleY(1); }
         }

         .count-up {
             font-variant-numeric: tabular-nums;
         }

         .channel-line {
             position: relative;
             overflow: hidden;
         }

         .channel-line::after {
             content: '';
             position: absolute;
             top: 0;
             left: -100%;
             width: 100%;
             height: 100%;
             background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.3), transparent);
             animation: dataFlow 3s linear infinite;
         }

         @keyframes dataFlow {
             0% { left: -100%; }
             100% { left: 100%; }
         }

         .cta-card {
             position: relative;
             overflow: hidden;
             transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
         }

         .cta-card::before {
             content: '';
             position: absolute;
             top: 0;
             left: 0;
             right: 0;
             height: 3px;
             transition: height 0.3s;
         }

         .cta-card:hover::before {
             height: 4px;
         }

         .cta-card:hover {
             transform: translateY(-4px);
         }

         .cta-camera::before { background: linear-gradient(90deg, #ef4444, #f59e0b); }
         .cta-raw::before { background: linear-gradient(90deg, #f59e0b, #22d3ee); }
         .cta-mix::before { background: linear-gradient(90deg, #22d3ee, #10b981); }

         .step-connector {
             position: relative;
         }

         .step-connector::after {
             content: '';
             position: absolute;
             top: 50%;
             right: -2rem;
             width: 2rem;
             height: 2px;
             background: linear-gradient(90deg, rgba(34,211,238,0.5), transparent);
         }

         @media (max-width: 768px) {
             .step-connector::after { display: none; }
         }

         .bg-grid {
